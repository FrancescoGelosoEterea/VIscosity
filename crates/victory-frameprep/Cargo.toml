[package]
name = "victory-frameprep"
description = "CPU frame preparation: a measured worker pool, command lists recorded on several threads and run in order, persistent descriptor slots, culling, and CPU and GPU profiling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
victory-unimem = { path = "../victory-unimem" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[lints]
workspace = true
